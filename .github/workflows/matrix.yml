name: Matrix job
on: push
jobs:
    build:
     strategy:
      matrix:
         node-version: [12, 14, 16]
         operating-system: [ubuntu-latest, windows-latest]
     runs-on: ubuntu-latest
     steps:
        - name: get code
          uses: actions/checkout@v3
        - name: install node js
          uses: actions/setup-node@v3
          with:
            node-version: 14
        - name:  install dependecies
          run: npm ci
        - name: build
          run: npm run build
